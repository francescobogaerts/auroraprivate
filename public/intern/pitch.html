<script>
(function(){
  var deck = document.getElementById('deck');
  deck.appendChild(document.getElementById('slides').content.cloneNode(true));
  var slides = Array.prototype.slice.call(deck.querySelectorAll('.slide'));
  var i = 0;
  try{ var h = parseInt((location.hash||'').replace('#s',''),10); if(h>0 && h<=slides.length) i = h-1; }catch(e){}
  var count = document.getElementById('count');

  function fit(){
    var s = Math.min(innerWidth/1920, innerHeight/1080);
    deck.style.transform = 'translate(-50%,-50%) scale(' + s + ')';
  }
  function go(n){
    i = Math.max(0, Math.min(slides.length-1, n));
    slides.forEach(function(s,j){ s.classList.toggle('on', j===i); s.setAttribute('aria-hidden', j!==i); });
    count.textContent = (i+1) + ' / ' + slides.length;
    try{ history.replaceState(null,'','#s'+(i+1)); }catch(e){}
  }
  addEventListener('resize', fit); fit(); go(i);

  document.getElementById('prev').onclick = function(){ go(i-1); };
  document.getElementById('next').onclick = function(){ go(i+1); };

  var ov = document.getElementById('overview');
  function openOverview(){
    ov.innerHTML = '';
    slides.forEach(function(s,j){
      var b = document.createElement('button'); b.type='button'; if(j===i) b.className='cur';
      var t = document.createElement('div'); t.className='thumb';
      var inner = document.createElement('div'); var c = s.cloneNode(true); c.classList.add('on'); c.removeAttribute('aria-hidden'); inner.appendChild(c); t.appendChild(inner);
      b.appendChild(t); var cap = document.createElement('span'); cap.textContent = (j+1) + ' · ' + s.dataset.title; b.appendChild(cap);
      b.onclick = function(){ closeOverview(); go(j); };
      ov.appendChild(b);
      requestAnimationFrame(function(){ inner.style.transform = 'scale(' + (t.clientWidth/1920) + ')'; });
    });
    ov.hidden = false; loadPhotos(ov);
    var cur = ov.querySelector('.cur'); if(cur) cur.focus();
  }
  function closeOverview(){ ov.hidden = true; }
  document.getElementById('ov').onclick = function(){ ov.hidden ? openOverview() : closeOverview(); };
  document.getElementById('fs').onclick = function(){
    var el = document.documentElement;
    if(document.fullscreenElement){ document.exitFullscreen && document.exitFullscreen().catch(function(){}); }
    else if(el.requestFullscreen){ el.requestFullscreen().catch(function(){}); }
  };

  addEventListener('keydown', function(e){
    if(e.key==='ArrowRight'||e.key==='PageDown'||e.key===' '){ e.preventDefault(); if(ov.hidden) go(i+1); }
    else if(e.key==='ArrowLeft'||e.key==='PageUp'){ e.preventDefault(); if(ov.hidden) go(i-1); }
    else if(e.key==='Home'){ go(0); } else if(e.key==='End'){ go(slides.length-1); }
    else if(e.key==='o'||e.key==='O'){ ov.hidden ? openOverview() : closeOverview(); }
    else if(e.key==='Escape' && !ov.hidden){ closeOverview(); }
  });

  var x0=null;
  addEventListener('touchstart', function(e){ if(ov.hidden) x0 = e.touches[0].clientX; }, {passive:true});
  addEventListener('touchend', function(e){ if(x0===null) return; var dx = e.changedTouches[0].clientX - x0; if(Math.abs(dx)>40) go(i + (dx<0?1:-1)); x0=null; }, {passive:true});

  function loadPhotos(root){
    root.querySelectorAll('[data-photo]').forEach(function(fig){
      var img = fig.querySelector('img'); if(!img || img.dataset.started) return; img.dataset.started='1';
      var base = 'assets/photography/' + fig.getAttribute('data-photo');
      var tries = [base+'.jpg', base+'.png'];
      function next(){ if(!tries.length){ fig.classList.add('is-pending'); return; } img.src = tries.shift(); }
      img.addEventListener('error', next); img.addEventListener('load', function(){ fig.classList.remove('is-pending'); });
      next();
    });
  }
  loadPhotos(deck);
  if(location.search.indexOf('print')>-1) document.documentElement.classList.add('printing');
})();
</script>
